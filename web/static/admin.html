<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Admin — ScriptRisk</title>
<link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
<link rel="stylesheet" href="/static/site.css">
<script defer src="/static/common.js"></script>
<script defer src="/static/admin.js"></script>
</head>
<body>
<main>
  <div class="container">
    <div class="page-head">
      <span class="kicker">Admin</span>
      <h1>Operations</h1>
      <p class="lede" id="adm-sub">Live pulse, activity log, and users. Refreshes every 10 seconds.</p>
    </div>
    <div class="card wr-card" id="adm-controls" style="padding: 16px 26px; margin-bottom: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
      <b>New-run kill switch</b>
      <button id="adm-pause-btn" class="btn btn-secondary" type="button">…</button>
      <span id="adm-pause-note" class="lede" style="margin: 0; font-size: 14px;"></span>
    </div>
    <div class="counter-strip" id="adm-pulse" style="margin-top: 0;"></div>
    <div class="section-head"><h2>Running now</h2></div>
    <div id="adm-live" class="card wr-card" style="padding: 20px 26px;"></div>
    <div class="section-head"><h2>Users</h2></div>
    <div class="compare-scroll"><table class="compare-table" id="adm-users"></table></div>
    <div class="section-head"><h2>Activity log</h2><p class="lede">Server events and browser beacons, newest first.</p></div>
    <div class="compare-scroll"><table class="compare-table" id="adm-logs"></table></div>
  </div>
</main>
</body>
</html>
